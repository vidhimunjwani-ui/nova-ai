version: 1
applications:
  - appRoot: my-app
    frontend:
      # Tells Amplify to deploy this as a Next.js SSR application.
      # Without this, Amplify may treat the app as a static export and
      # never start the SSR Lambda — meaning API routes won't run and
      # process.env variables set in the Amplify Console won't reach them.
      framework: Next.js - SSR
      phases:
        preBuild:
          commands:
            - npm ci --legacy-peer-deps
        build:
          commands:
            # Fail fast if the required secrets are not present in the build environment.
            # These must be set in the Amplify console: App settings > Environment variables.
            # They are server-side only (no NEXT_PUBLIC_ prefix) and are never sent to the browser.
            - |
              if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
                echo "ERROR: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in"
                echo "       the Amplify console under App settings > Environment variables."
                exit 1
              fi
            - npm run build
      artifacts:
        # SSR mode: App Router + API routes run server-side.
        # Do NOT set baseDirectory to 'out' - that is for static export only.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
