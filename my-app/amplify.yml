version: 1
applications:
  - appRoot: my-app
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --legacy-peer-deps
        build:
          commands:
            # Export runtime secrets into the Next.js SSR Lambda environment.
            # These variable names must exactly match what is set in the Amplify
            # console under App settings > Environment variables.
            # They are NOT NEXT_PUBLIC_ variables — they are never sent to the
            # browser. They are only read server-side inside the API routes.
            - export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
            - export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
            - export CLOUDFLARE_CHAT_MODEL=$CLOUDFLARE_CHAT_MODEL
            - export CLOUDFLARE_IMAGE_MODEL=$CLOUDFLARE_IMAGE_MODEL
            - npm run build
      artifacts:
        # SSR mode (App Router + API routes) — Amplify reads .next directly.
        # Do NOT use baseDirectory: out — that is only for static export.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
      environmentVariables:
        # Declare the server-side secrets Amplify must inject into the
        # SSR Lambda at runtime. Values are managed in the Amplify console
        # under App settings > Environment variables — NOT committed here.
        # Required variables:
        #   CLOUDFLARE_API_TOKEN      — Cloudflare Workers AI API token
        #   CLOUDFLARE_ACCOUNT_ID     — Cloudflare account ID
        # Optional (have code-level defaults if unset):
        #   CLOUDFLARE_CHAT_MODEL     — e.g. @cf/meta/llama-3.1-8b-instruct-fp8-fast
        #   CLOUDFLARE_IMAGE_MODEL    — e.g. @cf/black-forest-labs/flux-1-schnell
        CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
        CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
        CLOUDFLARE_CHAT_MODEL: $CLOUDFLARE_CHAT_MODEL
        CLOUDFLARE_IMAGE_MODEL: $CLOUDFLARE_IMAGE_MODEL
