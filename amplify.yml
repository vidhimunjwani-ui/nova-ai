version: 1
runtime-versions:
  nodejs: 20
frontend:
  phases:
    preBuild:
      commands:
        - cd $([ -d my-app ] && echo my-app || echo .) && npm ci
    build:
      commands:
        - cd $([ -d my-app ] && echo my-app || echo .) && npm run build
  artifacts:
    baseDirectory: my-app/.next
    files:
      - '**/*'
  cache:
    paths:
      - my-app/node_modules/**/*
      - my-app/.next/cache/**/*
