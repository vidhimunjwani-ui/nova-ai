version: 1
runtime-versions:
  nodejs: 20
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
    start:
      commands:
        - cd .next/standalone && PORT=$PORT HOSTNAME=0.0.0.0 node server.js
  artifacts:
    baseDirectory: .next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - my-app/node_modules/**/*
      - my-app/.next/cache/**/*
